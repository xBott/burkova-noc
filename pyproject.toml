[project]
name = "burkova-noc"
version = "0.1.0"
description = "Storm Night: call classifier and analysis for the Voltika outage voicebot"
readme = "README.md"
authors = [
    { name = "_xBott", email = "roma.plakhotniuk07@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
burkova-noc = "burkova_noc:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
